[pytest]
# Where routine `pytest` (no args, from repo root) looks for tests.
#
# - RoboPhD/unit_tests: tests of RoboPhD core.
# - examples: pytest walks the tree, picking up tests in any
#   `examples/<task>/unit_tests/` directory. Adding a new example with its
#   own unit_tests/ subdir works automatically — no config update needed.
#   The root conftest.py's `pytest_ignore_collect` hook skips misnamed CLI
#   scripts at example roots (e.g. examples/sudoku/test_eval_candidate.py)
#   during recursive discovery — see the conftest docstring for why
#   collect_ignore_glob is the wrong tool here.
#
# Integration tests in `tests/` (which spawn Claude Code via
# optimize_anything) are intentionally not included; run them explicitly
# with `pytest tests/` when you need them.
testpaths =
    RoboPhD/unit_tests
    examples
