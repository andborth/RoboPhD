[pytest]
# Where routine `pytest` (no args, from repo root) looks for tests.
#
# Scoped to RoboPhD core because the example suites cannot share a pytest
# process with it or with each other: each example ships a flat
# evaluator.py / main.py / model_registry.py and imports them by bare name
# after putting its own directory on sys.path, so whichever suite imports
# first wins `sys.modules` and the rest silently exercise the wrong
# example's code. Their unit_tests/ directories additionally collide as a
# package named `unit_tests`, and forcing collection past that deadlocks on
# a multiprocessing-based test.
#
# `scripts/run_tests.sh` is the full sweep — it runs every suite, each in
# its own process, and picks up new examples automatically. Run it before
# pushing; a bare `pytest` only covers core.
#
# Integration tests in `tests/` (which spawn Claude Code via
# optimize_anything) are intentionally not included; run them explicitly
# with `pytest tests/` when you need them. The root conftest.py's
# `pytest_ignore_collect` hook skips misnamed CLI scripts at example roots
# (e.g. examples/sudoku/test_eval_candidate.py) when a run does reach the
# examples tree — see the conftest docstring for why collect_ignore_glob is
# the wrong tool there.
testpaths =
    RoboPhD/unit_tests
